services:
  backend:
    image: backend2-app

    build:
      context: .
      dockerfile: Dockerfile.dev

    container_name: backend-dev-container

    ports:
      - "3001:3001"

    env_file:
      - .env

    volumes:
      - .:/app
      - /app/node_modules

    command: npm run dev:container

    environment:
      - CHOKIDAR_USEPOLLING=true
      - NODE_ENV=development

    depends_on:
      - redis

    restart: unless-stopped

    networks:
      - portfolio-network

  redis:
    image: redis:8-alpine

    container_name: redis-dev-container

    ports:
      - "6379:6379"

    restart: unless-stopped

    networks:
      - portfolio-network

  nginx:
    image: nginx:latest

    container_name: nginx-dev-container

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro

    depends_on:
      - backend

    restart: unless-stopped

    networks:
      - portfolio-network

networks:
  portfolio-network:
    external: true